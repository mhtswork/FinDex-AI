<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanks for reaching out | FinDex AI</title>
    <meta
      name="description"
      content="Thanks for your demo request. Someone from the FinDex AI team will get back to you shortly."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --bg-soft: #0f1b2d;
        --card: rgba(15, 27, 45, 0.9);
        --text: #f4f7fb;
        --muted: #97a7bf;
        --accent: #3dd8c5;
        --accent-2: #6e8cff;
        --border: rgba(255, 255, 255, 0.1);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, rgba(61, 216, 197, 0.18), transparent 35%), var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 640px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      }

      .eyebrow {
        display: inline-block;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.79rem;
        margin-bottom: 12px;
      }

      h1 {
        font-size: clamp(1.8rem, 3vw, 2.7rem);
        line-height: 1.1;
        margin: 0 0 12px;
      }

      p {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
        margin: 0 0 24px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      a.button:hover {
        transform: translateY(-1px);
      }

      a.primary {
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #041018;
      }

      a.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">FinDex AI</div>
      <h1>Thanks for your submission.</h1>
      <p>
        Someone from our team will get in touch with you shortly to talk through your demo request and next steps.
      </p>
      <div class="actions">
        <a class="button primary" href="index.html">Back to FinDex AI</a>
      </div>
    </main>
  </body>
</html>
